name: Velo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify (Windows 10 x64)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Velo.sln

    - name: Build Solution
      run: dotnet build Velo.sln -c Release --no-restore

    - name: Run Test Suites
      run: dotnet test Velo.sln -c Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"
